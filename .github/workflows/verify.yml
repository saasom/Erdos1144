name: Verify Lean proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the published source snapshot
        run: sha256sum --check verification/source-snapshot.sha256

      - name: Build with pinned Lean and Mathlib
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Audit public theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee axiom-audit.txt
          python3 scripts/check_axioms.py axiom-audit.txt

      - name: Preserve axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-audit
          path: axiom-audit.txt
          if-no-files-found: warn
